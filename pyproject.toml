[project]
name = "llm-text-alpha"
version = "0.1.0"
description = "Score SEC filings with dictionary, FinBERT and LLM methods under strict point-in-time and contamination controls."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "avmhdt" }]
dependencies = [
    "eqpit",
    "polars>=1.20",
    "duckdb>=1.1",
    "pyarrow>=17",
    "numpy>=2.0",
    "scipy>=1.13",
    "exchange-calendars>=4.5",
    "httpx>=0.27",
    "tenacity>=9",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "structlog>=24.1",
    "selectolax>=0.3",
    "lxml>=5",
    "statsmodels>=0.14",
    "linearmodels>=6.0",
    "matplotlib>=3.9",
    "torch>=2.4",
    "transformers>=4.44",
    "anthropic>=2.4.0",
    "spacy==3.8.16",
    "en-core-web-sm",
]

[project.optional-dependencies]
wrds = ["wrds>=3.1"]
local-llm = ["huggingface-hub>=0.24"]

[project.scripts]
lta = "llm_text_alpha.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_text_alpha"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
eqpit = { git = "https://github.com/avmhdt/equity-factor-pipeline", subdirectory = "packages/eqpit", rev = "2ee3583274ed544ac009fc894283ac69ed422a2f" }
overfitlab = { git = "https://github.com/avmhdt/backtest-overfitting-lab", rev = "ab5bf0c" }
torch = [{ index = "pytorch-cpu" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "pre-commit>=4.0",
    "overfitlab",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/llm_text_alpha"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "pyarrow.*", "lxml.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "data: needs real data under DATA_DIR (local only)",
    "network: hits a live service (local only)",
    "slow: long-running",
    "gpu: needs a CUDA device",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["src/llm_text_alpha"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
